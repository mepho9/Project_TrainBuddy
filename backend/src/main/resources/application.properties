spring.application.name=trainbuddy
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trainbuddy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:TrainBuddySuperSecretKeyForJwtGeneration202620262026}
app.jwt.expiration-ms=86400000

# URL utilisée par Stripe pour revenir vers le frontend.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# IMPORTANT :
# ne jamais écrire les vraies clés Stripe ici.
# Elles seront fournies via variables d'environnement.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}